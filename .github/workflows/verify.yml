# ═══════════════════════════════════════════════════════════════════════
# VÉRIFICATIONS D'INVARIANTS — Node seul, sans navigateur, sans bun

# Ces deux scripts sont des ASSERTIONS sur le code (copy des 12 langues,
# verrous premium, montants dérivés de lib/pricing, ordre du funnel…). Ils
# ne pilotent aucun navigateur et n'ont besoin d'aucune dépendance : ils
# lisent des fichiers et calculent.
#
# Volontairement EXCLUS de ce workflow, car ils exigent un navigateur
# (Playwright/Chromium) qui n'est pas installé ici :
#   scripts/targeted-browser.cjs, scripts/media-hub-proof.cjs,
#   scripts/rebrand-verify.cjs, scripts/fallback-proof.cjs,
#   scripts/local-path-proof.cjs, scripts/final-driver.cjs
#
# `bun` n'est pas utilisé non plus : la suite d'assertions tourne sur Node
# (voir package.json → verify:locks / verify:upgrade / verify:honesty).
# ═══════════════════════════════════════════════════════════════════════
name: verify

on:
  push:
    branches: [main]
  pull_request:

# Le workflow ne fait que lire le code.
permissions:
  contents: read

# Un push qui en remplace un autre annule le run devenu inutile.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assertions — verrous premium + conversion
        run: npm run verify:honesty

      - name: Typecheck
        run: npx tsc -b --noEmit
